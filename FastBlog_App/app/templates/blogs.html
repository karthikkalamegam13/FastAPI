{% extends "base.html" %}

{% block content %}
    <h1 class="mb-4">Blog Posts</h1>
    <div class="row">
        {% for blog in blogs %}
            <div class="col-md-6 mb-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title"><a href="/blogs/{{ blog.id }}">{{ blog.title }}</a></h5>
                        <p class="card-text">{{ blog.body }}</p>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
{% endblock %}
